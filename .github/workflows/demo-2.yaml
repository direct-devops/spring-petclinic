name: Build and Push Docker Image

on:
  push:
    branches:
      - "*"

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Docker insecure registry
        run: |
          echo '{
            "insecure-registries": [
              "3.208.29.184:8081"
            ]
          }' | sudo tee /etc/docker/daemon.json

          sudo systemctl restart docker

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Nexus Docker Registry
        uses: docker/login-action@v3
        with:
          registry: 34.229.212.219:8081
          username: admin #${{ secrets.NEXUS_USERNAME }}
          password: admin123#${{ secrets.NEXUS_PASSWORD }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            3.208.29.184:8081/qt-dev-dcoker/spring-petclinic:${{ github.sha }}
            3.208.29.184:8081/qt-dev-dcoker/spring-petclinic:latest
